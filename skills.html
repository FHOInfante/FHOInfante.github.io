  <script>
    (function() {
      try {
        var el = document.getElementById('projects-data');
        if (!el) return;
        var data = JSON.parse(el.textContent);
        var skillsGrid = document.getElementById('skills-grid');
        var filterBar = document.getElementById('filter-bar');
        var skills = data.skills || [];

        var categories = [];
        skills.forEach(function(s) {
          if (categories.indexOf(s.category) === -1) categories.push(s.category);
        });

        categories.forEach(function(cat) {
          var btn = document.createElement('button');
          btn.className = 'filter-btn';
          btn.dataset.filter = cat;
          btn.textContent = cat;
          filterBar.appendChild(btn);
        });

        function renderSkills(filter) {
          skillsGrid.innerHTML = '';
          categories.forEach(function(cat) {
            if (filter !== 'all' && filter !== cat) return;
            var group = skills.filter(function(s) { return s.category === cat; });
            if (group.length === 0) return;

            var section = document.createElement('div');
            section.className = 'skills-category';

            var heading = document.createElement('h2');
            heading.className = 'skills-category-title';
            heading.textContent = cat;
            section.appendChild(heading);

            var grid = document.createElement('div');
            grid.className = 'skills-grid';

            group.forEach(function(s) {
              var card = document.createElement('div');
              card.className = 'skill-card';
              var icon = document.createElement('div');
              icon.className = 'skill-icon';
              var img = document.createElement('img');
              img.src = s.icon;
              img.alt = s.name;
              img.loading = 'lazy';
              icon.appendChild(img);
              var name = document.createElement('h3');
              name.textContent = s.name;
              card.appendChild(icon);
              card.appendChild(name);
              grid.appendChild(card);
            });

            section.appendChild(grid);
            skillsGrid.appendChild(section);
          });
        }

        renderSkills('all');

        filterBar.addEventListener('click', function(e) {
          var btn = e.target.closest('.filter-btn');
          if (!btn) return;
          filterBar.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          renderSkills(btn.dataset.filter);
        });
      } catch(e) {}
    })();
  </script>
