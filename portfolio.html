  <script>
    (function() {
      function getLanguageColor(lang) {
        const colors = {
          'Python': '#3572A5',
          'JavaScript': '#f1e05a',
          'TypeScript': '#3178c6',
          'HTML': '#e34c26',
          'CSS': '#563d7c',
          'ASP.NET': '#9400D3',
          'C#': '#178600',
          'Java': '#b07219'
        };
        return colors[lang] || '#8ba38e';
      }

      function buildCard(repo, index) {
        const desc = repo.description || 'No description provided.';
        const lang = repo.language || 'N/A';
        const color = getLanguageColor(repo.language);
        const previewPath = `website-photos/${encodeURIComponent(repo.name)}-Preview.png`;

        return `
          <article class="project-card" data-lang="${repo.language || 'N/A'}" style="animation-delay: ${(index || 0) * 60}ms">
            <div class="project-card-visual">
              <img src="${previewPath}" alt="${repo.name}" loading="lazy" class="preview-img" onerror="this.classList.add('failed')">
              <span class="placeholder-icon">&lt;/&gt;</span>
              ${lang !== 'N/A' ? `<span class="lang-dot">${lang}</span>` : ''}
            </div>
            <div class="project-card-body">
              <h3>${repo.name}</h3>
              <p>${desc}</p>
              <div class="project-card-meta">
                <span>&#9733; ${repo.stars}</span>
                <span>&#969; ${repo.forks}</span>
                <span>${new Date(repo.updatedAt).toLocaleDateString()}</span>
              </div>
            </div>
            <div class="project-card-footer">
              <a class="button button-primary button-small" href="${repo.url}" target="_blank" rel="noopener noreferrer">View Repo</a>
            </div>
          </article>
        `;
      }

      function currentFilter() {
        return document.querySelector('.filter-btn.active')?.dataset?.filter || 'all';
      }

      function renderRepos(data) {
        const container = document.getElementById('repo-grid');
        const projects = data.projects || [];
        const filter = currentFilter();

        let filtered = projects;
        if (filter !== 'all') {
          filtered = projects.filter(r => r.language === filter);
        }

        if (filtered.length === 0) {
          container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:48px 0;font-family:var(--font-mono);font-size:0.85rem;">No projects match this filter.</p>';
          return;
        }

        container.innerHTML = filtered.map((r, i) => buildCard(r, i)).join('');
      }

      function showError(msg) {
        const container = document.getElementById('repo-grid');
        container.innerHTML = `<div class="repo-error"><p>${msg}</p></div>`;
      }

      function setupFilters(data) {
        const bar = document.getElementById('filter-bar');
        bar.addEventListener('click', (e) => {
          const btn = e.target.closest('.filter-btn');
          if (!btn) return;

          bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          renderRepos(data);
        });
      }

      document.addEventListener('DOMContentLoaded', function() {
        try {
          var el = document.getElementById('projects-data');
          if (!el) throw new Error('No data');
          var data = JSON.parse(el.textContent);
          setupFilters(data);
          renderRepos(data);
        } catch (e) {
          showError('Could not load projects. Please try again later or visit <a href="https://github.com/FHOInfante" target="_blank" style="color:var(--green-bright);text-decoration:underline;">github.com/FHOInfante</a>.');
        }
      });
    })();
  </script>
