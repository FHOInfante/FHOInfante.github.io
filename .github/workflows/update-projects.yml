name: Update Projects

on:
  schedule:
    # Run once daily at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch repos and generate projects.json
        run: node scripts/fetch-projects.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.json index.html portfolio.html about.html skills.html certificates.html experience.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update project data"
            git push
          fi
